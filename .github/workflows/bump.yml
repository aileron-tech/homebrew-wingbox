name: bump

# Regenerates the formula when PyPI has a new Wingbox version, tests it with
# Homebrew and pushes it. Uses this repository's own token; no stored secret.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the latest release on PyPI
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/generate_formula.py > "$RUNNER_TEMP/wingbox.rb"
          if cmp -s "$RUNNER_TEMP/wingbox.rb" Formula/wingbox.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Regenerate
        id: regenerate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$(brew --repository aileron-tech/wingbox)"
          python3 tools/generate_formula.py > "$RUNNER_TEMP/wingbox.rb"
          cp "$RUNNER_TEMP/wingbox.rb" Formula/wingbox.rb
          echo "version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/wingbox.rb)" >> "$GITHUB_OUTPUT"
      - name: Install and test
        run: |
          brew style aileron-tech/wingbox
          brew install aileron-tech/wingbox/wingbox
          brew test aileron-tech/wingbox/wingbox
      - name: Push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.regenerate.outputs.version }}
        run: |
          cd "$(brew --repository aileron-tech/wingbox)"
          if git diff --quiet -- Formula/wingbox.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wingbox.rb
          git commit -m "wingbox ${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
